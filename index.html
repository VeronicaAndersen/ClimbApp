<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greppmästerskapen</title>
    <meta name="description" content="Climbing competition website" />
    <meta name="author" content="By-Veran" />

    <meta property="og:title" content="Greppmästerskapen" />
    <meta property="og:description" content="Greppmästerskapen" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://grepp.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#f4f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a16" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint (see src/store/theme.ts).
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
